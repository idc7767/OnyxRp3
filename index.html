.ttl{flex:1;font-weight:600}

.empty{text-align:center;color:var(--mut);padding:30px}
.lang{position:relative}

s kannatanu abitut seisundit.\n14|Посягання на життя співробітника правоохоронного органу|Құқық қорғау органы қызметкерінің өміріне қастандық жасау|Õiguskaitseorgani töötaja elu kallal kallaletung|Посягання на життя співробітника правоохоронного органу, військовослужбовця або їхніх близьких з метою перешкодження законній діяльності. Включає застосування насильства (небезпечного або не небезпечного для життя), погрози у зв’язку з виконанням посадових обов’язків.|Заңды қызметке кедергі келтіру мақсатында құқық қорғау органы қызметкерінің, әскери қызметшінің немесе олардың жақындарының өміріне қастандық жасау. Зорлық қолдануды (өмірге қауіпті немесе қауіпсіз), қызметтік міндеттерін орындауға байланысты қоқан-лоққы жасауды қамтиды.|Kallaletung õiguskaitseorgani töötaja, sõjaväelase või nende lähedaste elule seadusliku tegevuse takistamise eesmärgil. Hõlmab vägivalla kasutamist (eluohtlikku või mitteeluohtlikku) ja ähvardusi seoses ametikohustuste täitmisega.\n15|Викрадення людини|Адам ұрлау|Inimrööv|Незаконне заволодіння, переміщення та утримання людини всупереч її волі.|Адамды оның еркіне қарсы заңсыз иелену, жылжыту және ұстау.|Inimese ebaseaduslik haaramine, teisaldamine ja kinnihoidmine tema tahte vastaselt.\n16|Захоплення заручника|Кепілге адам алу|Pantvangi võtmine|Захоплення або утримання особи як заручника з метою примусити державу, організацію або громадянина вчинити певну дію.|Мемлекетті, ұйымды немесе азаматты қандай да бір әрекет жасауға мәжбүрлеу мақсатында адамды кепілге алу немесе ұстау.|Isiku haaramine või kinnihoidmine pantvangina eesmärgiga sundida riiki, organisatsiooni või kodanikku teatud tegevust sooritama.\n17|Використання рабської праці|Құлдық еңбекті пайдалану|Orjatöö kasutamine|Використання праці людини, щодо якої здійснюються повноваження, притаманні праву власності.|Меншік құқығына тән өкілеттіктер жүзеге асырылатын адамның еңбегін пайдалану.|Inimese töö kasutamine, kelle suhtes teostatakse omandiõigusele omaseid volitusi.\n18|Завідомо неправдиве повідомлення про акт тероризму|Терроризм актісі туралы көрінеу жалған хабарлау|Teadvalt vale teade terrorismiaktist|Неправдиве повідомлення про підготовку вибуху, підпалу або інших дій, що створюють небезпеку загибелі людей.|Жарылыс, өртеу немесе адамдардың қазасына қауіп төндіретін өзге де әрекеттердің дайындалып жатқаны туралы жалған хабарлау.|Vale teade ettevalmistatavast plahvatusest, süütamisest või muudest tegudest, mis ohustavad inimeste elu.\n19|Вандалізм|Вандализм|Vandalism|Осквернення будівель або інших споруд, псування майна в громадському транспорті чи інших громадських місцях.|Ғимараттарды немесе өзге құрылыстарды қорлау, қоғамдық көлікте не басқа қоғамдық орындарда мүлікті бүлдіру.|Hoonete või muude rajatiste rüvetamine, vara rikkumine ühissõidukites või muudes avalikes kohtades.\n20|Хуліганство|Бұзақылық|Huligaansus|Грубе порушення громадського порядку, що виражає явну неповагу до суспільства.|Қоғамға айқын құрметсіздікті білдіретін қоғамдық тәртіпті өрескел бұзу.|Avaliku korra jõhker rikkumine, mis väljendab ilmset lugupidamatust ühiskonna vastu.\n21|Бандитизм|Бандитизм|Bandiitlus|Створення стійкої озброєної групи (банди) з метою нападу на громадян або організації, а також керівництво такою групою.|Азаматтарға немесе ұйымдарға шабуыл жасау мақсатында тұрақты қарулы топ (банда) құру, сондай-ақ мұндай топты басқару.|Püsiva relvastatud grupi (jõugu) loomine eesmärgiga rünnata kodanikke või organisatsioone, samuti sellise grupi juhtimine.\n22|Псування майна|Мүлікті бүлдіру|Vara rikkumine|Псування або знищення майна цивільних осіб чи державних організацій.|Азаматтық тұлғалардың немесе мемлекеттік ұйымдардың мүлкін бүлдіру немесе жою.|Tsiviilisikute või riigiorganisatsioonide vara rikkumine või hävitamine.\n23|Незаконні придбання, зберігання, перевезення, виготовлення, переробка наркотиків|Есірткіні заңсыз сатып алу, сақтау, тасымалдау, дайындау, өңдеу|Narkootikumide ebaseaduslik soetamine, hoidmine, vedu, valmistamine, töötlemine|Незаконні придбання, зберігання, перевезення, виготовлення, переробка наркотичних засобів, психотропних речовин або їхніх аналогів.|Есірткі құралдарын, психотроптық заттарды немесе олардың аналогтарын заңсыз сатып алу, сақтау, тасымалдау, дайындау, өңдеу.|Narkootiliste ainete, psühhotroopsete ainete või nende analoogide ebaseaduslik soetamine, hoidmine, vedu, valmistamine ja töötlemine.\n24|Носіння зброї у відкритому вигляді|Қаруды ашық алып жүру|Relva avalik kandmine|Носіння холодної або вогнепальної зброї в публічних місцях без чохла/кобури (за винятком силових відомств на службі).|Қоғамдық орындарда суық немесе атыс қаруын қапсыз/қапшықсыз алып жүру (қызметтегі күш құрылымдарын қоспағанда).|Külm- või tulirelva kandmine avalikes kohtades ilma ümbrise/kabuurita (välja arvatud teenistuses olevad jõuametid).\n25|Угон транспортного засобу|Көлік құралын айдап әкету|Sõiduki omavoliline ärasõit|Неправомірне заволодіння автомобілем або іншим транспортним засобом без мети викрадення (угон з метою покататися).|Автокөлікті немесе өзге көлік құралын ұрлау мақсатынсыз құқыққа сыйымсыз иелену (қыдыру мақсатында айдап әкету).|Auto või muu sõiduki õigusvastane omastamine ilma varastamise eesmärgita (omavoliline sõit lõbusõidu eesmärgil).\n26|Залишення місця ДТП|Жол-көлік оқиғасы орнынан кетіп қалу|Avariikohalt lahkumine|Залишення водієм місця дорожньо-транспортної пригоди (ДТП), учасником якої він був.|Жүргізушінің өзі қатысқан жол-көлік оқиғасы (ЖКО) орнынан кетіп қалуы.|Juhi lahkumine liiklusõnnetuse kohalt, milles ta osales.\n27|Порушення недоторканності житла|Тұрғын үйдің қол сұғылмаушылығын бұзу|Eluruumi puutumatuse rikkumine|Незаконне проникнення на приватну територію або до житла без згоди мешканця та без мети крадіжки.|Тұрғынның келісімінсіз және ұрлық мақсатынсыз жеке аумаққа немесе тұрғын үйге заңсыз кіру.|Ebaseaduslik sisenemine eraterritooriumile või eluruumi elaniku nõusolekuta ja ilma varguse eesmärgita.\n28|Незаконне проникнення на охоронюваний об’єкт|Қорғалатын объектіге заңсыз кіру| рушення вимог законодавства у сфері охорони здоров’я", "kk": "Денсаулық сақтау саласындағы заң талаптарын бұзу", "et": "Tervishoiualaste õigusnõuete rikkumine"}, "d": {"ru": "Нарушение установленных правил гигиены, карантина, работы медицинских учреждений.", "uk": "Порушення встановлених правил гігієни, карантину, роботи медичних закладів.", "kk": "Гигиена, карантин, медициналық мекемелердің жұмысы туралы белгіленген ережелерді бұзу.", "et": "Kehtestatud hügieeni-, karantiini- ja meditsiiniasutuste töökorra rikkumine."}, "p": "f4000"}]});
DATA.splice(DATA.findIndex(s=>s.id==="law"),0,{"id": "upk", "t": {"ru": "🕵️ УПК", "uk": "🕵️ КПК", "kk": "🕵️ ҚІЖК", "et": "🕵️ Kriminaalmenetluse seadustik"}, "items": [{"h": {"ru": "Глава I. Следствие", "uk": "Розділ I. Слідство", "kk": "I тарау. Тергеу", "et": "I peatükk. Uurimine"}}, {"n": "ℹ️", "t": {"ru": "Вводное положение", "uk": "Вступне положення", "kk": "Кіріспе ереже", "et": "Sissejuhatav säte"}, "d": {"ru": "Следствие - комплекс мер по выяснению обстоятельств, связанных с правонарушением, для установления обстановки и характера преступления, а также лиц, виновных в совершении преступления.", "uk": "Слідство — комплекс заходів з з’ясування обставин, пов’язаних із правопорушенням, для встановлення обстановки та характеру злочину, а також осіб, винних у його вчиненні.", "kk": "Тергеу — құқық бұзушылыққа байланысты мән-жайларды анықтауға, қылмыстың жағдайы мен сипатын, сондай-ақ оны жасаған кінәлі тұлғаларды белгілеуге бағытталған іс-шаралар кешені.", "et": "Uurimine on õigusrikkumisega seotud asjaolude väljaselgitamise meetmete kogum, et kindlaks teha kuriteo olukord ja laad ning süüdlased."}}, {"n": "Ст. 1", "t": {"ru": "Следственные действия", "uk": "Слідчі дії", "kk": "Тергеу әрекеттері", "et": "Uurimistoimingud"}, "d": {"ru": "Сотрудники правоохранительных органов и прокуратуры обязаны инициировать расследование в случаях:\nКогда сотрудник стал непосредственным очевидцем правонарушения.\nКогда потерпевшие или очевидцы обратились с просьбой отреагировать на правонарушения, очевидцами которого они являлись.\nКогда были обнаружены следы преступления.\nКогда были получены доказательства от должностных лиц, являющихся сотрудниками государственных учреждений (в том числе, сотрудников средств массовой информации), о наличии сведений, указывающих на факт преступления.", "uk": "Співробітники правоохоронних органів і прокуратури зобов’язані розпочати розслідування у випадках:\nКоли співробітник став безпосереднім свідком правопорушення.\nКоли потерпілі або свідки звернулися з проханням відреагувати на правопорушення, свідками якого вони були.\nКоли виявлено сліди злочину.\nКоли отримано докази від посадових осіб — співробітників державних установ (зокрема засобів масової інформації) про наявність відомостей, що вказують на факт злочину.", "kk": "Құқық қорғау органдарының және прокуратураның қызметкерлері мына жағдайларда тергеу бастауға міндетті:\nҚызметкер құқық бұзушылықтың тікелей куәсі болғанда.\nЗардап шеккендер немесе куәгерлер өздері куә болған құқық бұзушылыққа әрекет етуді сұраған кезде.\nҚылмыс іздері табылғанда.\nМемлекеттік мекемелер қызметкерлері болып табылатын лауазымды тұлғалардан (бұқаралық ақпарат құралдарының қызметкерлерін қоса) қылмыс фактісін көрсететін мәліметтер туралы дәлелдер алынғанда.", "et": "Õiguskaitseorganite ja prokuratuuri töötajad on kohustatud alustama uurimist juhtudel, kui:\nTöötaja oli õigusrikkumise vahetu pealtnägija.\nKannatanud või pealtnägijad palusid reageerida õigusrikkumisele, mida nad nägid.\nAvastati kuriteo jäljed.\nRiigiasutuste töötajatest ametiisikutelt (sh meediatöötajatelt) saadi tõendeid kuriteole viitavate andmete kohta."}}, {"n": "Ст. 2", "t": {"ru": "Виды следственных действий и принципы ведения расследования", "uk": "Види слідчих дій і принципи ведення розслідування", "kk": "Тергеу әрекеттерінің түрлері және тергеу жүргізу қағидаттары", "et": "Uurimistoimingute liigid ja uurimise põhimõtted"}, "d": {"ru": "Перечень доступных следственных мероприятий и основные принципы их проведения.\nВиды следственных действий: Допрос, обыск, осмотр, досмотр, освидетельствование, опознание, следственный эксперимент.\nПринципы ведения расследования: Индивидуальность, безотлагательность, законность, адекватность.", "uk": "Перелік доступних слідчих заходів та основні принципи їх проведення.\nВиди слідчих дій: допит, обшук, огляд, досмотр, освідчення, впізнання, слідчий експеримент.\nПринципи ведення розслідування: індивідуальність, невідкладність, законність, адекватність.", "kk": "Қолжетімді тергеу іс-шараларының тізбесі және оларды жүргізудің негізгі қағидаттары.\nТергеу әрекеттерінің түрлері: жауап алу, тінту, қарап-тексеру, жеке тінту, куәландыру, тану, тергеу эксперименті.\nТергеу жүргізу қағидаттары: даралық, кідіртпеушілік, заңдылық, барабарлық.", "et": "Kättesaadavate uurimismeetmete loetelu ja nende läbiviimise põhimõtted.\nUurimistoimingute liigid: ülekuulamine, läbiotsimine, ülevaatus, kontroll, vaatlus, äratundmine, uurimiseksperiment.\nUurimise põhimõtted: individuaalsus, viivitamatus, seaduslikkus, proportsionaalsus."}}, {"n": "Ст. 3", "t": {"ru": "Передача дела", "uk": "Передача справи", "kk": "Істі тапсыру", "et": "Asja üleandmine"}, "d": {"ru": "В случаях, если сотрудник по объективным причинам не может или не уполномочен продолжать расследование, он обязан передать его уполномоченному сотруднику с подробным изложением всех известных ему обстоятельств, передать материалы дела, а также передать подозреваемого, если он был задержан.", "uk": "Якщо співробітник з об’єктивних причин не може або не уповноважений продовжувати розслідування, він зобов’язаний передати його уповноваженому співробітникові з детальним викладом усіх відомих йому обставин, передати матеріали справи, а також передати підозрюваного, якщо його було затримано.", "kk": "Егер қызметкер объективті себептермен тергеуді жалғастыра алмаса немесе оған құқығы болмаса, ол өзіне белгілі барлық мән-жайларды толық баяндай отырып, істі өкілетті қызметкерге беруге, іс материалдарын, сондай-ақ ұсталған болса күдіктіні тапсыруға міндетті.", "et": "Kui töötaja ei saa objektiivsetel põhjustel uurimist jätkata või pole selleks volitatud, peab ta andma asja üle volitatud töötajale, esitades üksikasjalikult kõik talle teada olevad asjaolud, andma üle toimiku materjalid ning kinnipeetud kahtlustatava."}}, {"n": "Ст. 4", "t": {"ru": "Письменная отчетность", "uk": "Письмова звітність", "kk": "Жазбаша есептілік", "et": "Kirjalik aruandlus"}, "d": {"ru": "Дело должно вестись с полной письменной отчетностью в случаях, предусмотренных внутренним регламентом, либо в случаях необходимости передачи дела в суд.", "uk": "Справа має вестися з повною письмовою звітністю у випадках, передбачених внутрішнім регламентом, або у випадках необхідності передачі справи до суду.", "kk": "Іс ішкі регламентте көзделген жағдайларда немесе істі сотқа беру қажет болғанда толық жазбаша есептілікпен жүргізілуі тиіс.", "et": "Asja menetlemisel tuleb pidada täielikku kirjalikku aruandlust sisereglemendis ette nähtud juhtudel või siis, kui asi tuleb kohtusse üle anda."}}, {"n": "Ст. 5", "t": {"ru": "Розыск", "uk": "Розшук", "kk": "Іздестіру", "et": "Tagaotsimine"}, "d": {"ru": "Предшествующая суду процедура дознания и сбора улик. Розыск включает в себя все допустимые законом процедуры и регламенты.", "uk": "Процедура дізнання та збирання доказів, що передує суду. Розшук включає всі допустимі законом процедури та регламенти.", "kk": "Сотқа дейінгі анықтау және дәлелдемелер жинау рәсімі. Іздестіру заңмен рұқсат етілген барлық рәсімдер мен регламенттерді қамтиды.", "et": "Kohtule eelnev ülekuulamis- ja tõendite kogumise menetlus. Tagaotsimine hõlmab kõiki seadusega lubatud menetlusi ja reglemente."}}, {"h": {"ru": "Глава II. Процедура задержания", "uk": "Розділ II. Процедура затримання", "kk": "II тарау. Ұстау рәсімі", "et": "II peatükk. Kinnipidamise kord"}}, {"n": "ℹ️", "t": {"ru": "Вводное положение", "uk": "Вступне положення", "kk": "Кіріспе ереже", "et": "Sissejuhatav säte"}, "d": {"ru": "Задержание - мера кратковременного ограничения свободы человека на срок до одного процессуального часа (60 минут). Нарушение регламентов задержания (пропуск обязательных шагов, отсутствие зачитывания прав Миранды) является грубым NonRP поведением или влечет за собой строгий выговор от Прокуратуры / Администрации.", "uk": "Затримання — захід короткочасного обмеження свободи людини на строк до однієї процесуальної години (60 хвилин). Порушення регламентів затримання (пропуск обов’язкових кроків, відсутність зачитування прав Міранди) є грубою NonRP поведінкою або тягне за собою сувору догану від Прокуратури / Адміністрації.", "kk": "Ұстау — адамның бостандығын процессуалдық бір сағатқа (60 минут) дейінгі мерзімге қысқа уақытқа шектеу шарасы. Ұстау регламенттерін бұзу (міндетті қадамдарды өткізіп алу, Миранда құқықтарын оқымау) өрескел NonRP мінез-құлық болып табылады немесе Прокуратураның / Әкімшіліктің қатаң сөгісіне әкеледі.", "et": "Kinnipidamine on inimese vabaduse lühiajaline piiramine kuni ühe protsessuaalse tunni (60 minutit) jooksul. Kinnipidamisreeglite rikkumine (kohustuslike sammude vahelejätmine, Miranda õiguste mittelugemine) on jäme NonRP käitumine või toob kaasa range noomituse prokuratuurilt / administratsioonilt."}}, {"n": "Ст. 6", "t": {"ru": "Основание для задержания", "uk": "Підстава для затримання", "kk": "Ұстау негіздемесі", "et": "Kinnipidamise alus"}, "d": {"ru": "Лицо может быть задержано в случае совершения преступления или подозрения в совершении преступления только при наличии следующих оснований:\nЛицо застигнуто в момент совершения преступления, либо непосредственно после его совершения;\nНа лице, его теле, одежде обнаружены следы преступления;\nИмеется видеофиксация совершения лицом преступных деяний;\nИмеется нормативно-правовой акт, предписывающий задержание лица;\nПроведение процедуры установления личности;\nПроведение процедуры идентификации;\nАктивная ориентировка с камер видеонаблюдения.", "uk": "Особа може бути затримана у разі вчинення злочину або підозри у його вчиненні лише за наявності таких підстав:\nОсобу застали в момент вчинення злочину або безпосередньо після нього;\nНа особі, її тілі, одязі виявлено сліди злочину;\nІснує відеофіксація вчинення особою злочинних діянь;\nІснує нормативно-правовий акт, що приписує затримання особи;\nПроведення процедури встановлення особи;\nПроведення процедури ідентифікації;\nАктивна орієнтировка з камер відеоспостереження.", "kk": "Тұлға қылмыс жасаған немесе қылмыс жасады деп күдік туындаған жағдайда тек мынадай негіздер болғанда ғана ұсталуы мүмкін:\nТұлға қылмыс жасау сәтінде немесе одан кейін бірден қолға түскен;\nТұлғада, оның денесінде, киімінде қылмыс іздері табылған;\nТұлғаның қылмыстық әрекеттер жасағанын бейнеге түсіру бар;\nТұлғаны ұстауды белгілейтін нормативтік құқықтық акт бар;\nТұлғаны анықтау рәсімін жүргізу;\nСәйкестендіру рәсімін жүргізу;\nБейнебақылау камераларынан белсенді бағдарлама (ориентировка).", "et": "Isikut võib kuriteo toimepanemise või selle kahtluse korral kinni pidada ainult järgmistel alustel:\nIsik tabati kuriteo toimepanemise hetkel või vahetult pärast seda;\nIsikul, tema kehal või riietel avastati kuriteo jäljed;\nOlemas on videosalvestis isiku kuritegelikest tegudest;\nOlemas on õigusakt, mis kohustab isiku kinni pidama;\nIsikusamasuse tuvastamise menetluse läbiviimine;\nIdentifitseerimismenetluse läbiviimine;\nAktiivne tagaotsimisteade valvekaamerate kaudu."}}, {"n": "Ст. 7", "t": {"ru": "Порядок задержания гражданских лиц", "uk": "Порядок затримання цивільних осіб", "kk": "Азаматтық тұлғаларды ұстау тәртібі", "et": "Tsiviilisikute kinnipidamise kord"}, "d": {"ru": "Порядком задержания государственным служащим гражданского лица признаются действия, описанные исключительно в следующем строгом хронологическом порядке:\nШаг 1: Надеть на человека наручники.\nШаг 2: Представиться, при этом идентифицировав себя в соответствии с законом о государственной службе.\nШаг 3: Сообщить и, по требованию задержанного, разъяснить задержанному причину, по которой он задержан. В случае задержания лица по ориентировке, необходимо уведомить об этом гражданина, а также разъяснить причину, описанную в той же ориентировке.\nШаг 4: Произвести досмотр любых документов задержанного, устанавливающих его личность.\nШаг 5: На усмотрение сотрудника, проводящего процессуальные действия, произвести первичный обыск задержанного на наличие оружия. В случае обнаружения огнестрельного или холодного оружия, оно подлежит изъятию.\nШаг 6: Сверить внешность и иные данные задержанного с базой разыскиваемых.\nШаг 7: Посадить задержанного на заднее сиденье транспорта, пристегнуть задержанного ремнем безопасности и обеспечить полную безопасность жизни и здоровья задержанного, лишить задержанного возможности самовольно покинуть транспортное средство в момент движения и остановки.\nШаг 8: Зачитать задержанному его права (Вы имеете право хранить молчание. Всё, что вы скажете, может и будет использовано против вас. Вы имеете право на адвоката/суд и один телефонный звонок).\nШаг 9: Предложить задержанному реализацию его законных прав (Суд, телефонный звонок).", "uk": "Порядком затримання цивільної особи державним службовцем визнаються дії, описані виключно в такій суворій хронологічній послідовності:\nКрок 1: Надіти на людину кайданки.\nКрок 2: Представитися, ідентифікувавши себе відповідно до закону про державну службу.\nКрок 3: Повідомити і, на вимогу затриманого, роз’яснити причину затримання. У разі затримання за орієнтуванням — повідомити про це громадянина та роз’яснити причину, зазначену в тому самому орієнтуванні.\nКрок 4: Оглянути будь-які документи затриманого, що встановлюють його особу.\nКрок 5: На розсуд співробітника, який проводить процесуальні дії, провести первинний обшук затриманого на наявність зброї. У разі виявлення вогнепальної або холодної зброї вона підлягає вилученню.\nКрок 6: Звірити зовнішність та інші дані затриманого з базою розшукуваних.\nКрок 7: Посадити затриманого на заднє сидіння транспорту, пристебнути ременем безпеки та забезпечити повну безпеку його життя і здоров’я, позбавити можливості самовільно залишити транспортний засіб під час руху та зупинки.\nКрок 8: Зачитати затриманому його права (Ви маєте право мовчати. Усе, що ви скажете, може та буде використано проти вас. Ви маєте право на адвоката/суд і один телефонний дзвінок).\nКрок 9: Запропонувати затриманому реалізувати його законні права (Суд, телефонний дзвінок).", "kk": "Мемлекеттік қызметшінің азаматтық тұлғаны ұстау тәртібі деп тек мына қатаң хронологиялық ретпен сипатталған әрекеттер танылады:\n1-қадам: Адамға қолқап (кісен) салу.\n2-қадам: Өзін таныстыру, мемлекеттік қызмет туралы заңға сәйкес сәйкестендіру.\n3-қадам: Ұсталған адамның талабы бойынша ұстау себебін хабарлау және түсіндіру. Бағдарлама (ориентировка) бойынша ұсталған жағдайда азаматқа осы туралы хабарлап, сол бағдарламада көрсетілген себепті түсіндіру.\n4-қадам: Ұсталғанның жеке басын растайтын кез келген құжатты тексеру.\n5-қадам: Іс-әрекеттерді жүргізіп жатқан қызметкердің қалауы бойынша ұсталғанды қару бар-жоғына алдын ала тінту. Атыс немесе суық қару табылса, ол алынуға жатады.\n6-қадам: Ұсталғанның сыртқы келбетін және өзге деректерін іздестірудегілер базасымен салыстыру.\n7-қадам: Ұсталғанды көліктің артқы отырғышына отырғызып, қауіпсіздік белдігін тағу, оның өмірі мен денсаулығының толық қауіпсіздігін қамтамасыз ету, қозғалыс және тоқтау кезінде көлікті өз бетінше тастап кетуіне жол бермеу.\n8-қадам: Ұсталғанға құқықтарын оқып беру (Сіз үндемеуге құқылысыз. Сіз айтқан барлық нәрсе сізге қарсы пайдаланылуы мүмкін және пайдаланылады. Сіздің адвокатқа/сотқа және бір телефон қоңырауына құқығыңыз бар).\n9-қадам: Ұсталғанға заңды құқықтарын іске асыруды ұсыну (Сот, телефон қоңырауы).", "et": "Riigiteenistuja poolt tsiviilisiku kinnipidamise korraks loetakse üksnes allpool kirjeldatud toiminguid rangelt selles ajalises järjekorras:\nSamm 1: Panna inimesele käerauad.\nSamm 2: Tutvustada end, tuvastades end riigiteenistuse seaduse kohaselt.\nSamm 3: Teatada ja kinnipeetava nõudmisel selgitada kinnipidamise põhjust. Tagaotsimisteate alusel kinnipidamise korral teavitada sellest kodanikku ja selgitada samas teates märgitud põhjust.\nSamm 4: Kontrollida kõiki kinnipeetava isikut tõendavaid dokumente.\nSamm 5: Menetlustoimingut läbiviiva töötaja äranägemisel teha kinnipeetavale esmane läbiotsimine relvade leidmiseks. Tulirelva või külmrelva leidmisel see konfiskeeritakse.\nSamm 6: Võrrelda kinnipeetava välimust ja muid andmeid tagaotsitavate andmebaasiga.\nSamm 7: Istutada kinnipeetav sõiduki tagaistmele, kinnitada turvavöö ning tagada tema elu ja tervise täielik turvalisus, võtta talle võimalus sõidukist liikumise ja peatumise ajal omavoliliselt lahkuda.\nSamm 8: Lugeda kinnipeetavale ette tema õigused (Teil on õigus vaikida. Kõike, mida te ütlete, võidakse ja kasutatakse teie vastu. Teil on õigus advokaadile/kohtule ja ühele telefonikõnele).\nSamm 9: Pakkuda kinnipeetavale tema seaduslike õiguste teostamist (kohus, telefonikõne)."}}, {"n": "Ст. 8", "t": {"ru": "Отсутствие судьи", "uk": "Відсутність судді", "kk": "Судьяның болмауы", "et": "Kohtuniku puudumine"}, "d": {"ru": "Если судья не приехал в течение 5-ти минут, то сотрудник имеет право отвезти задержанного в тюрьму.", "uk": "Якщо суддя не приїхав протягом 5 хвилин, співробітник має право відвезти затриманого до в’язниці.", "kk": "Егер судья 5 минут ішінде келмесе, қызметкер ұсталғанды түрмеге апаруға құқылы.", "et": "Kui kohtunik ei saabu 5 minuti jooksul, on töötajal õigus viia kinnipeetav vanglasse."}}, {"n": "Ст. 9", "t": {"ru": "Порядок задержания госслужащих", "uk": "Порядок затримання держслужбовців", "kk": "Мемлекеттік қызметшілерді ұстау тәртібі", "et": "Riigiteenijate kinnipidamise kord"}, "d": {"ru": "Процедура ограничения свободы лиц, состоящих на государственной службе:\nШаг 1: Надеть на человека наручники.\nШаг 2: Представиться, при этом идентифицировав себя в соответствии с законом о государственной службе.\nШаг 3: Сообщить и, по требованию задержанного, разъяснить задержанному причину, по которой он задержан.\nШаг 4: Произвести досмотр любых документов задержанного, удостоверяющих его личность.\nШаг 5: Проверить на факт принадлежности к перечню лиц, защищенных законом о неприкосновенности должностных лиц. В случае, если лицо защищено таковым законом - освободить из-под стражи до момента отзыва неприкосновенности в порядке, установленном законом, за исключением случаев, предусмотренных вышеуказанным законом.\nШаг 6: Сверить внешность и иные данные задержанного с базой разыскиваемых, в случае, если лицо и особые приметы задержанного перекрыты инородными предметами, разрешается их удалить.\nШаг 7: Посадить задержанного на заднее сиденье транспорта, который имеет государственный регистрационный знак, пристегнуть задержанного ремнем безопасности и обеспечить полную безопасность жизни и здоровья задержанного, лишить задержанного возможности самовольно покинуть транспортное средство в момент движения и остановки (допускается пешая доставка задержанного при расстоянии до 300 метров от места событий до департамента полиции).\nШаг 8: Зачитать задержанному права.\nШаг 9: Доставить задержанного в полицейский участок.\nШаг 10: Предложить задержанному реализацию его законных прав, и, по запросу задержанного, лицо, проводящее задержание обязуется реализовать права задержанного.\nШаг 11: Вызвать по месту задержания руководство структуры, органа, отделения или подразделения задержанного, а также прокурора, который примет решение о виновности или невиновности задержанного лица.", "uk": "Процедура обмеження свободи осіб, які перебувають на державній службі:\nКрок 1: Надіти на людину кайданки.\nКрок 2: Представитися, ідентифікувавши себе відповідно до закону про державну службу.\nКрок 3: Повідомити і, на вимогу затриманого, роз’яснити причину затримання.\nКрок 4: Оглянути будь-які документи затриманого, що посвідчують його особу.\nКрок 5: Перевірити належність до переліку осіб, захищених законом про недоторканність посадових осіб. Якщо особа захищена таким законом — звільнити з-під варти до моменту відкликання недоторканності в порядку, встановленому законом, за винятком випадків, передбачених зазначеним законом.\nКрок 6: Звірити зовнішність та інші дані затриманого з базою розшукуваних; якщо обличчя та особливі прикмети затриманого закриті сторонніми предметами, дозволяється їх прибрати.\nКрок 7: Посадити затриманого на заднє сидіння транспорту з державним реєстраційним знаком, пристебнути ременем безпеки та забезпечити повну безпеку його життя і здоров’я, позбавити можливості самовільно залишити транспортний засіб під час руху та зупинки (допускається піша доставка затриманого, якщо відстань від місця подій до департаменту поліції не перевищує 300 метрів).\nКрок 8: Зачитати затриманому права.\nКрок 9: Доставити затриманого до поліцейської дільниці.\nКрок 10: Запропонувати затриманому реалізувати його законні права, і за запитом затриманого особа, яка проводить затримання, зобов’язується реалізувати права затриманого.\nКрок 11: Викликати за місцем затримання керівництво структури, органу, відділення чи підрозділу затриманого, а також прокурора, який ухвалить рішення про винуватість або невинуватість затриманої особи.", "kk": "Мемлекеттік қызметте тұрған тұлғалардың бостандығын шектеу рәсімі:\n1-қадам: Адамға қолқап салу.\n2-қадам: Өзін таныстыру, мемлекеттік қызмет туралы заңға сәйкес сәйкестендіру.\n3-қадам: Ұсталған адамның талабы бойынша ұстау себебін хабарлау және түсіндіру.\n4-қадам: Ұсталғанның жеке басын куәландыратын кез келген құжатты тексеру.\n5-қадам: Лауазымды тұлғалардың қол сұғылмауы туралы заңмен қорғалатындар тізбесіне жататындығын тексеру. Егер тұлға осындай заңмен қорғалса — аталған заңда көзделген жағдайларды қоспағанда, қол сұғылмаушылық заңда белгіленген тәртіппен қайтарып алынғанға дейін қамаудан босату.\n6-қадам: Ұсталғанның сыртқы келбетін және өзге деректерін іздестірудегілер базасымен салыстыру; егер бет-әлпеті мен ерекше белгілері бөтен заттармен жабылса, оларды алуға рұқсат етіледі.\n7-қадам: Ұсталғанды мемлекеттік тіркеу белгісі бар көліктің артқы отырғышына отырғызып, қауіпсіздік белдігін тағу, оның өмірі мен денсаулығының толық қауіпсіздігін қамтамасыз ету, қозғалыс және тоқтау кезінде көлікті өз бетінше тастап кетуіне жол бермеу (оқиға орнынан полиция департаментіне дейінгі қашықтық 300 метрге дейін болғанда ұсталғанды жаяу жеткізуге рұқсат етіледі).\n8-қадам: Ұсталғанға құқықтарын оқып беру.\n9-қадам: Ұсталғанды полиция бөліміне жеткізу.\n10-қадам: Ұсталғанға заңды құқықтарын іске асыруды ұсыну және ұсталғанның сұрауы бойынша ұстауды жүргізіп жатқан тұлға оның құқықтарын іске асыруға міндетті.\n11-қадам: Ұстау орнына ұсталғанның құрылымының, органының, бөлімшесінің немесе бөлімінің басшылығын, сондай-ақ ұсталған тұлғаның кінәлі немесе кінәсіз екендігі туралы шешім қабылдайтын прокурорды шақыру.", "et": "Riigiteenistuses olevate isikute vabaduse piiramise kord:\nSamm 1: Panna inimesele käerauad.\nSamm 2: Tutvustada end, tuvastades end riigiteenistuse seaduse kohaselt.\nSamm 3: Teatada ja kinnipeetava nõudmisel selgitada kinnipidamise põhjust.\nSamm 4: Kontrollida kõiki kinnipeetava isikut tõendavaid dokumente.\nSamm 5: Kontrollida, kas isik kuulub ametiisikute puutumatuse seadusega kaitstute loetellu. Kui isikut kaitseb selline seadus, vabastada ta vahi alt kuni puutumatuse tühistamiseni seaduses sätestatud korras, välja arvatud nimetatud seaduses ette nähtud juhtudel.\nSamm 6: Võrrelda kinnipeetava välimust ja muid andmeid tagaotsitavate andmebaasiga; kui isiku nägu ja eritunnused on võõrkehadega kaetud, on lubatud need eemaldada.\nSamm 7: Istutada kinnipeetav riikliku registreerimismärgiga sõiduki tagaistmele, kinnitada turvavöö ning tagada tema elu ja tervise täielik turvalisus, võtta talle võimalus sõidukist liikumise ja peatumise ajal omavoliliselt lahkuda (kinnipeetava jalgsi toimetamine on lubatud, kui vahemaa sündmuskohast politseiosakonnani on kuni 300 meetrit).\nSamm 8: Lugeda kinnipeetavale ette tema õigused.\nSamm 9: Toimetada kinnipeetav politseijaoskonda.\nSamm 10: Pakkuda kinnipeetavale tema seaduslike õiguste teostamist ning kinnipeetava taotlusel on kinnipidamist läbiviiv isik kohustatud tema õigused teostama.\nSamm 11: Kutsuda kinnipidamiskohta kinnipeetava struktuuri, organi, osakonna või allüksuse juhtkond ning prokurör, kes otsustab kinnipeetava süü või süütuse üle."}}]});
DATA.splice(DATA.findIndex(s=>s.id==="law"),0,{"id": "prok", "t": {"ru": "🏛️ Прокуратура", "uk": "🏛️ Прокуратура", "kk": "🏛️ Прокуратура", "et": "🏛️ Prokuratuur"}, "items": [{"n": "ℹ️", "t": {"ru": "Вводное положение", "uk": "Вступне положення", "kk": "Кіріспе ереже", "et": "Sissejuhatav säte"}, "d": {"ru": "Единая федеральная централизованная система органов, осуществляет надзор за соблюдением Конституции Российской Федерации и исполнением законов, надзор за соблюдением прав и свобод человека и гражданина, уголовное преследование в соответствии со своими полномочиями, а также выполняет иные функции.", "uk": "Єдина федеральна централізована система органів, що здійснює нагляд за дотриманням Конституції Російської Федерації та виконанням законів, нагляд за дотриманням прав і свобод людини і громадянина, кримінальне переслідування відповідно до своїх повноважень, а також виконує інші функції.", "kk": "Конституцияның Ресей Федерациясында сақталуын және заңдардың орындалуын қадағалауды, адам мен азаматтың құқықтары мен бостандықтарының сақталуын қадағалауды, өз өкілеттіктеріне сәйкес қылмыстық қудалауды жүзеге асыратын, сондай-ақ өзге де функцияларды орындайтын органдардың бірыңғай федералдық орталықтандырылған жүйесі.", "et": "Ühtne föderaalne tsentraliseeritud organite süsteem, mis teostab järelevalvet Venemaa Föderatsiooni põhiseaduse järgimise ja seaduste täitmise üle, inimese ja kodaniku õiguste ja vabaduste järgimise üle, teostab oma pädevuse piires kriminaalmenetlust ning täidab muid ülesandeid."}}, {"n": "Ст. 1", "t": {"ru": "Сфера деятельности Прокуратуры РФ", "uk": "Сфера діяльності Прокуратури РФ", "kk": "РФ Прокуратурасының қызмет саласы", "et": "Vene Föderatsiooni prokuratuuri tegevusala"}, "d": {"ru": "В целях обеспечения верховенства закона, единства и укрепления законности, защиты прав и свобод Прокуратура осуществляет:\nНадзор за исполнением законов и соблюдением прав человека органами власти.\nНадзор за исполнением законов органами, осуществляющими оперативно-розыскную деятельность, дознание и предварительное следствие.\nНадзор за исполнением законов судебными приставами.\nНадзор за исполнением законов администрациями органов и учреждений, исполняющих наказание, мест содержания задержанных и заключенных под стражу.\nУголовное преследование в соответствии с полномочиями, установленными уголовно-процессуальным законодательством.\nКоординацию деятельности правоохранительных органов по борьбе с преступностью.\nВозбуждение дел об административных правонарушениях и проведение административного расследования.\nПодконтрольные субъекты: Федеральные органы исполнительной власти, Следственный комитет Российской Федерации, органы государственной власти субъектов РФ, органы публичной власти федеральных территорий, органы местного самоуправления, органы военного управления, органы контроля, их должностные лица, субъекты общественного контроля в местах принудительного содержания, а также органы управления коммерческих и некоммерческих организаций.", "uk": "З метою забезпечення верховенства закону, єдності та зміцнення законності, захисту прав і свобод Прокуратура здійснює:\nНагляд за виконанням законів і дотриманням прав людини органами влади.\nНагляд за виконанням законів органами, що здійснюють оперативно-розшукову діяльність, дізнання та досудове слідство.\nНагляд за виконанням законів судовими приставами.\nНагляд за виконанням законів адміністраціями органів і установ, що виконують покарання, місць тримання затриманих і взятих під варту.\nКримінальне переслідування відповідно до повноважень, установлених кримінально-процесуальним законодавством.\nКоординацію діяльності правоохоронних органів щодо боротьби зі злочинністю.\nПорушення справ про адміністративні правопорушення та проведення адміністративного розслідування.\nПідконтрольні суб’єкти: федеральні органи виконавчої влади, Слідчий комітет Російської Федерації, органи державної влади суб’єктів РФ, органи публічної влади федеральних територій, органи місцевого самоврядування, органи військового управління, органи контролю, їхні посадові особи, суб’єкти громадського контролю в місцях примусового тримання, а також органи управління комерційних і некомерційних організацій.", "kk": "Заңның үстемдігін, заңдылықтың бірлігі мен нығаюын, құқықтар мен бостандықтарды қорғауды қамтамасыз ету мақсатында Прокуратура мыналарды жүзеге асырады:\nБилік органдарының заңдардың орындалуын және адам құқықтарының сақталуын қадағалауы.\nОперативтік-іздестіру қызметін, анықтауды және алдын ала тергеуді жүзеге асыратын органдардың заңдардың орындалуын қадағалауы.\nСот орындаушыларының заңдардың орындалуын қадағалауы.\nЖазаны орындайтын органдар мен мекемелердің, ұсталғандар мен қамауға алынғандарды ұстау орындарының әкімшіліктерінің заңдардың орындалуын қадағалауы.\nҚылмыстық-процестік заңнамада белгіленген өкілеттіктерге сәйкес қылмыстық қудалау.\nҚұқық қорғау органдарының қылмысқа қарсы күрес жөніндегі қызметін үйлестіру.\nӘкімшілік құқық бұзушылық туралы істерді қозғау және әкімшілік тергеу жүргізу.\nБақыланатын субъектілер: федералдық атқарушы билік органдары, Ресей Федерациясының Тергеу комитеті, РФ субъектілерінің мемлекеттік билік органдары, федералдық аумақтардың қоғамдық билік органдары, жергілікті өзін-өзі басқару органдары, әскери басқару органдары, бақылау органдары, олардың лауазымды тұлғалары, мәжбүрлеп ұстау орындарындағы қоғамдық бақылау субъектілері, сондай-ақ коммерциялық және коммерциялық емес ұйымдардың басқару органдары.", "et": "Seaduse ülimuslikkuse, seaduslikkuse ühtsuse ja tugevdamise ning õiguste ja vabaduste kaitse tagamiseks teostab prokuratuur:\nJärelevalvet seaduste täitmise ja inimõiguste järgimise üle võimuorganite poolt.\nJärelevalvet seaduste täitmise üle operatiiv-uurimistegevust, ülekuulamist ja eeluurimist teostavates organites.\nJärelevalvet seaduste täitmise üle kohtutäiturite poolt.\nJärelevalvet seaduste täitmise üle karistusi täitvate organite ja asutuste ning kinnipeetavate ja vahistatute kinnipidamiskohtade administratsioonide poolt.\nKriminaalmenetlust kriminaalmenetlusõiguses sätestatud pädevuse kohaselt.\nÕiguskaitseorganite kuritegevusevastase tegevuse koordineerimist.\nHaldusrikkumiste asjade algatamist ja haldusuurimise läbiviimist.\nJärelevalvealused: föderaalsed täitevvõimuorganid, Venemaa Föderatsiooni Uurimiskomitee, Föderatsiooni subjektide riigivõimuorganid, föderaalterritooriumide avaliku võimu organid, kohaliku omavalitsuse organid, sõjaväejuhatuse organid, kontrolliorganid, nende ametiisikud, sundkinnipidamiskohtade avaliku kontrolli subjektid ning äri- ja mittetulundusühingute juhtorganid."}}, {"n": "Ст. 2", "t": {"ru": "Полномочия Прокурора", "uk": "Повноваження Прокурора", "kk": "Прокурордың өкілеттіктері", "et": "Prokuröri volitused"}, "d": {"ru": "Права и юридические возможности прокурора при осуществлении надзорных функций:\nПо предъявлении служебного удостоверения беспрепятственно входить на территории и в помещения поднадзорных органов, иметь доступ к их документам и материалам.\nТребовать от руководителей и должностных лиц представления необходимых документов, материалов, статистических данных; выделения специалистов; проведения проверок, контрольных мероприятий и ревизий (должностные лица обязаны приступить к выполнению требований незамедлительно).\nНаправлять требования о проведении контрольного (надзорного) мероприятия в уполномоченные органы на основании материалов о причинении вреда или угрозе вреда охраняемым ценностям.\nВозбуждать производство об административном правонарушении, требовать привлечения к ответственности, предостерегать о недопустимости нарушения закона.\nВ случае установления факта нарушения закона: освобождать своим постановлением лиц, незаконно подвергнутых административному задержанию несудебными органами; опротестовывать противоречащие закону акты, обращаться в суд для признания их недействительными, требовать дисциплинарного взыскания для должностного лица; вносить представления об устранении нарушений.", "uk": "Права та юридичні можливості прокурора під час здійснення наглядових функцій:\nЗа пред’явленням службового посвідчення безперешкодно входити на території та до приміщень піднаглядних органів, мати доступ до їхніх документів і матеріалів.\nВимагати від керівників і посадових осіб подання необхідних документів, матеріалів, статистичних даних; виділення спеціалістів; проведення перевірок, контрольних заходів і ревізій (посадові особи зобов’язані негайно приступити до виконання вимог).\nНаправляти вимоги про проведення контрольного (наглядового) заходу до уповноважених органів на підставі матеріалів про заподіяння шкоди або загрозу шкоди охоронюваним цінностям.\nПорушувати провадження про адміністративне правопорушення, вимагати притягнення до відповідальності, попереджати про неприпустимість порушення закону.\nУ разі встановлення факту порушення закону: звільняти своєю постановою осіб, незаконно підданих адміністративному затриманню позасудовими органами; опротестовувати акти, що суперечать закону, звертатися до суду для визнання їх недійсними, вимагати дисциплінарного стягнення для посадової особи; вносити подання про усунення порушень.", "kk": "Қадағалау функцияларын жүзеге асыру кезінде прокурордың құқықтары мен заңды мүмкіндіктері:\nҚызметтік куәлікті көрсеткенде қадағаланатын органдардың аумақтары мен үй-жайларына кедергісіз кіру, олардың құжаттары мен материалдарына қол жеткізу.\nБасшылар мен лауазымды тұлғалардан қажетті құжаттарды, материалдарды, статистикалық деректерді ұсынуды; мамандарды бөлуді; тексерулер, бақылау іс-шаралары мен ревизиялар жүргізуді талап ету (лауазымды тұлғалар талаптарды орындауға дереу кірісуге міндетті).\nҚорғалатын құндылықтарға зиян келтіру немесе зиян келтіру қаупі туралы материалдар негізінде бақылау (қадағалау) іс-шарасын жүргізу туралы талаптарды уәкілетті органдарға жолдау.\nӘкімшілік құқық бұзушылық туралы іс жүргізуді қозғау, жауапкершілікке тартуды талап ету, заңды бұзудың жол берілмейтіні туралы ескерту.\nЗаң бұзушылық фактісі анықталған жағдайда: әкімшілік тәртіппен заңсыз ұсталған тұлғаларды сотқа жатпайтын органдардан өз қаулысымен босату; заңға қайшы актілерге наразылық білдіру, оларды жарамсыз деп тану үшін сотқа жүгіну, лауазымды тұлғаға тәртіптік жаза қолдануды талап ету; бұзушылықтарды жою туралы ұсыныс енгізу.", "et": "Prokuröri õigused ja õiguslikud võimalused järelevalvefunktsioonide täitmisel:\nTeenistusliku tõendi esitamisel takistamatult siseneda järelevalvealuste organite territooriumile ja ruumidesse ning pääseda ligi nende dokumentidele ja materjalidele.\nNõuda juhtidelt ja ametiisikutelt vajalike dokumentide, materjalide ja statistiliste andmete esitamist; spetsialistide eraldamist; kontrollide, kontrollitoimingute ja auditite läbiviimist (ametiisikud on kohustatud nõudeid viivitamatult täitma).\nSaata pädevatele organitele nõudeid kontrolli- (järelevalve)toimingu läbiviimiseks materjalide alusel, mis viitavad kaitstavatele väärtustele tekitatud kahjule või kahju ohule.\nAlgatada haldusrikkumise menetlus, nõuda vastutusele võtmist, hoiatada seaduserikkumise lubamatuse eest.\nSeaduserikkumise tuvastamisel: vabastada oma määrusega isikud, keda mittekohtuorganid on ebaseaduslikult haldusvahistanud; esitada protest seadusevastastele aktidele, pöörduda kohtusse nende kehtetuks tunnistamiseks, nõuda ametiisikule distsiplinaarkaristust; esitada ettekirjutus rikkumiste kõrvaldamiseks."}}]});
DATA.splice(DATA.findIndex(s=>s.id==="law"),0,{"id": "gov", "t": {"ru": "🏛️ Правительство", "uk": "🏛️ Уряд", "kk": "🏛️ Үкімет", "et": "🏛️ Valitsus"}, "items": [{"n": "ℹ️", "t": {"ru": "Вводное положение", "uk": "Вступне положення", "kk": "Кіріспе ереже", "et": "Sissejuhatav säte"}, "d": {"ru": "Регулирует деятельность высшего исполнительного органа государственной власти, права и обязанности должностных лиц Правительства.", "uk": "Регулює діяльність вищого виконавчого органу державної влади, права та обов’язки посадових осіб Уряду.", "kk": "Мемлекеттік биліктің жоғары атқарушы органының қызметін, Үкімет лауазымды тұлғаларының құқықтары мен міндеттерін реттейді.", "et": "Reguleerib riigivõimu kõrgeima täitevorgani tegevust ning valitsuse ametiisikute õigusi ja kohustusi."}}, {"n": "Ст. 1", "t": {"ru": "Правительство как высший орган исполнительной власти", "uk": "Уряд як вищий орган виконавчої влади", "kk": "Үкімет — атқарушы биліктің жоғары органы", "et": "Valitsus kui täitevvõimu kõrgeim organ"}, "d": {"ru": "Правительство Нижегородской области / штата является постоянно действующим высшим исполнительным органом государственной власти, возглавляющим единую систему исполнительной власти субъекта.", "uk": "Уряд Нижньогородської області / штату є постійно діючим вищим виконавчим органом державної влади, який очолює єдину систему виконавчої влади суб’єкта.", "kk": "Нижний Новгород облысының / штатының Үкіметі — субъектінің бірыңғай атқарушы билік жүйесін басқаратын тұрақты жұмыс істейтін мемлекеттік биліктің жоғары атқарушы органы.", "et": "Nižni Novgorodi oblasti / osariigi valitsus on alaliselt tegutsev riigivõimu kõrgeim täitevorgan, mis juhib subjekti ühtset täitevvõimu süsteemi."}}, {"n": "Ст. 2", "t": {"ru": "Состав и структура Правительства", "uk": "Склад і структура Уряду", "kk": "Үкіметтің құрамы мен құрылымы", "et": "Valitsuse koosseis ja struktuur"}, "d": {"ru": "Правительство состоит из Губернатора (Главы), Вице-Губернаторов (Первых заместителей) и профильных Министров государственных ведомств (Министерства здравоохранения, Министерства обороны/Армии, Министерства Культуры и др.).", "uk": "Уряд складається з Губернатора (Глави), Віце-губернаторів (перших заступників) та профільних Міністрів державних відомств (Міністерство охорони здоров’я, Міністерство оборони/Армії, Міністерство культури тощо).", "kk": "Үкімет Губернатордан (Басшы), Вице-губернаторлардан (бірінші орынбасарлар) және мемлекеттік ведомстволардың салалық министрлерінен (Денсаулық сақтау министрлігі, Қорғаныс/Армия министрлігі, Мәдениет министрлігі және т.б.) тұрады.", "et": "Valitsus koosneb kubernerist (juht), asekubernerutest (esimesed asetäitjad) ja riigiasutuste valdkonnaministritest (tervishoiuministeerium, kaitse-/armeeministeerium, kultuuriministeerium jt)."}}, {"n": "Ст. 3", "t": {"ru": "Правовая основа деятельности", "uk": "Правова основа діяльності", "kk": "Қызметтің құқықтық негізі", "et": "Tegevuse õiguslik alus"}, "d": {"ru": "Правительство осуществляет свою деятельность в соответствии с Конституцией Российской Федерации, федеральными законами, постановлениями судов, уставом области и распоряжениями Губернатора.", "uk": "Уряд здійснює свою діяльність відповідно до Конституції Російської Федерації, федеральних законів, постанов судів, статуту області та розпоряджень Губернатора.", "kk": "Үкімет өз қызметін Ресей Федерациясының Конституциясына, федералдық заңдарға, соттардың қаулыларына, облыс жарғысына және Губернатордың өкімдеріне сәйкес жүзеге асырады.", "et": "Valitsus tegutseb kooskõlas Venemaa Föderatsiooni põhiseaduse, föderaalseaduste, kohtuotsuste, oblasti põhikirja ja kuberneri korraldustega."}}, {"n": "Ст. 4", "t": {"ru": "Руководство министерствами и ведомствами", "uk": "Керівництво міністерствами та відомствами", "kk": "Министрліктер мен ведомстволарды басқару", "et": "Ministeeriumide ja ametite juhtimine"}, "d": {"ru": "Правительство руководит работой министерств, контролирует исполнение государственных программ, координирует деятельность органов исполнительной власти и дает обязательные к исполнению указания руководителям фракций (МВД, Армия, МЗ и т.д.).", "uk": "Уряд керує роботою міністерств, контролює виконання державних програм, координує діяльність органів виконавчої влади та дає обов’язкові до виконання вказівки керівникам фракцій (МВС, Армія, МОЗ тощо).", "kk": "Үкімет министрліктердің жұмысын басқарады, мемлекеттік бағдарламалардың орындалуын бақылайды, атқарушы билік органдарының қызметін үйлестіреді және фракция басшыларына (ІІМ, Армия, ДСМ және т.б.) орындалуы міндетті нұсқаулар береді.", "et": "Valitsus juhib ministeeriumide tööd, kontrollib riigiprogrammide täitmist, koordineerib täitevvõimuorganite tegevust ning annab fraktsioonide juhtidele (SM, armee, TM jne) täitmiseks kohustuslikke korraldusi."}}, {"n": "Ст. 5", "t": {"ru": "Обеспечение безопасности и порядка", "uk": "Забезпечення безпеки та порядку", "kk": "Қауіпсіздік пен тәртіпті қамтамасыз ету", "et": "Turvalisuse ja korra tagamine"}, "d": {"ru": "Совместно с правоохранительными органами (МВД, ФСБ) разрабатывает и реализует меры по обеспечению законности, прав и свобод граждан, борьбе с преступностью и терроризмом, охране собственности и общественного порядка.", "uk": "Спільно з правоохоронними органами (МВС, ФСБ) розробляє та реалізує заходи із забезпечення законності, прав і свобод громадян, боротьби зі злочинністю та тероризмом, охорони власності та громадського порядку.", "kk": "Құқық қорғау органдарымен (ІІМ, ФҚҚ) бірлесіп заңдылықты, азаматтардың құқықтары мен бостандықтарын қамтамасыз ету, қылмыстылық пен терроризмге қарсы күрес, меншік пен қоғамдық тәртіпті қорғау жөніндегі шараларды әзірлейді және іске асырады.", "et": "Koos õiguskaitseorganitega (SM, FSB) töötab välja ja viib ellu meetmeid seaduslikkuse, kodanike õiguste ja vabaduste tagamiseks, kuritegevuse ja terrorismi vastu võitlemiseks ning vara ja avaliku korra kaitseks."}}, {"n": "Ст. 6", "t": {"ru": "Бюджетная и финансовая политика", "uk": "Бюджетна та фінансова політика", "kk": "Бюджеттік және қаржылық саясат", "et": "Eelarve- ja finantspoliitika"}, "d": {"ru": "Обеспечивает проведение единой финансовой, бюджетной и налоговой политики; распоряжается государственной казной, утверждает финансирование и выплату премий государственным структурам за результативную работу.", "uk": "Забезпечує проведення єдиної фінансової, бюджетної та податкової політики; розпоряджається державною скарбницею, затверджує фінансування та виплату премій державним структурам за результативну роботу.", "kk": "Бірыңғай қаржылық, бюджеттік және салық саясатының жүргізілуін қамтамасыз етеді; мемлекеттік қазынаны басқарады, мемлекеттік құрылымдарға нәтижелі жұмысы үшін қаржыландыруды және сыйлықақылар төлеуді бекітеді.", "et": "Tagab ühtse finants-, eelarve- ja maksupoliitika elluviimise; käsutab riigikassat, kinnitab riigiasutustele tulemusliku töö eest rahastamise ja preemiate maksmise."}}, {"n": "Ст. 7", "t": {"ru": "Назначение должностных лиц", "uk": "Призначення посадових осіб", "kk": "Лауазымды тұлғаларды тағайындау", "et": "Ametiisikute ametisse nimetamine"}, "d": {"ru": "Губернатор имеет полномочия назначать и отстранять от должности Министров, Вице-Губернаторов, а также в рамках закона согласовывать руководство подведомственных государственных фракций (Генерал МВД, Главврач МЗ и др.).", "uk": "Губернатор має повноваження призначати та відсторонювати від посади Міністрів, Віце-губернаторів, а також у межах закону погоджувати керівництво підвідомчих державних фракцій (Генерал МВС, Головлікар МОЗ тощо).", "kk": "Губернатор министрлерді, вице-губернаторларды қызметке тағайындауға және қызметтен шеттетуге, сондай-ақ заң шеңберінде бағынысты мемлекеттік фракциялардың басшылығын (ІІМ Генералы, ДСМ Бас дәрігері және т.б.) келісуге өкілетті.", "et": "Kubernerul on õigus nimetada ametisse ja ametist vabastada ministreid ja asekuberneride ning seaduse piires kooskõlastada alluvate riigifraktsioonide juhtkond (SM kindral, TM peaarst jt)."}}, {"n": "Ст. 8", "t": {"ru": "Статус неприкосновенности должностных лиц", "uk": "Статус недоторканності посадових осіб", "kk": "Лауазымды тұлғалардың қол сұғылмаушылық мәртебесі", "et": "Ametiisikute puutumatuse staatus"}, "d": {"ru": "Губернатор, Вице-Губернаторы и Министры во время исполнения полномочий обладают статусом неприкосновенности. Они не могут быть задержаны, досмотрены или подвергнуты обыску правоохранительными органами без соответствующего ордера Генерального Прокурора, решения Верховного Суда или процедуры отстранения (импичмента).", "uk": "Губернатор, Віце-губернатори та Міністри під час виконання повноважень мають статус недоторканності. Вони не можуть бути затримані, оглянуті або піддані обшуку правоохоронними органами без відповідного ордера Генерального прокурора, рішення Верховного суду або процедури відсторонення (імпічменту).", "kk": "Губернатор, вице-губернаторлар және министрлер өкілеттіктерін орындау кезінде қол сұғылмаушылық мәртебесіне ие. Оларды Бас прокурордың тиісті ордерінсіз, Жоғарғы Сот шешімінсіз немесе шеттету (импичмент) рәсімінсіз құқық қорғау органдары ұстай, тексере немесе тінте алмайды.", "et": "Kuberner, asekubernerid ja ministrid omavad volituste täitmise ajal puutumatuse staatust. Õiguskaitseorganid ei tohi neid kinni pidada, läbi vaadata ega läbi otsida ilma peaprokuröri vastava korralduseta, ülemkohtu otsuseta või kõrvaldamise (impeachment) menetluseta."}}, {"n": "Ст. 9", "t": {"ru": "Процедура отстранения от обязанностей (Импичмент)", "uk": "Процедура відсторонення від обов’язків (імпічмент)", "kk": "Міндеттерден шеттету рәсімі (импичмент)", "et": "Kohustustest kõrvaldamise kord (impeachment)"}, "d": {"ru": "В случае выявления фактов нарушения уголовного кодекса, государственной измена или превышения должностных полномочий членами Правительства, Прокурор вправе инициировать расследование с последующим рассмотрением вопроса в Верховном Суде для лишения неприкосновенности и привлечения к уголовной ответственности.", "uk": "У разі виявлення фактів порушення кримінального кодексу, державної зради або перевищення посадових повноважень членами Уряду Прокурор має право ініціювати розслідування з подальшим розглядом питання у Верховному суді для позбавлення недоторканності та притягнення до кримінальної відповідальності.", "kk": "Үкімет мүшелері қылмыстық кодексті бұзу, мемлекетке сатқындық жасау немесе қызметтік өкілеттіктерін асыра пайдалану фактілері анықталған жағдайда, Прокурор тергеу бастауға, одан кейін қол сұғылмаушылықтан айыру және қылмыстық жауапкершілікке тарту үшін мәселені Жоғарғы Сотта қарауға құқылы.", "et": "Kui valitsuse liikmete puhul tuvastatakse karistusseadustiku rikkumisi, riigireetmist või ametivolituste ületamist, on prokuröril õigus algatada uurimine ning seejärel esitada küsimus ülemkohtule puutumatuse äravõtmiseks ja kriminaalvastutusele võtmiseks."}}]});
DATA.splice(DATA.findIndex(s=>s.id==="law"),0,{"id": "mvd", "t": {"ru": "👮 МВД", "uk": "👮 МВС", "kk": "👮 ІІМ", "et": "👮 Siseministeerium"}, "items": [{"n": "ℹ️", "t": {"ru": "Вводное положение", "uk": "Вступне положення", "kk": "Кіріспе ереже", "et": "Sissejuhatav säte"}, "d": {"ru": "Определяет правовую основу работы Министерства Внутренних Дел, полномочия сотрудников полиции, правила применения спецсредств и оружия.", "uk": "Визначає правову основу роботи Міністерства внутрішніх справ, повноваження співробітників поліції, правила застосування спецзасобів і зброї.", "kk": "Ішкі істер министрлігі жұмысының құқықтық негізін, полиция қызметкерлерінің өкілеттіктерін, арнайы құралдар мен қаруды қолдану ережелерін айқындайды.", "et": "Määratleb siseministeeriumi töö õigusliku aluse, politseinike volitused ning erivahendite ja relvade kasutamise reeglid."}}, {"n": "Ст. 1", "t": {"ru": "Министерство внутренних дел и его задачи", "uk": "Міністерство внутрішніх справ та його завдання", "kk": "Ішкі істер министрлігі және оның міндеттері", "et": "Siseministeerium ja selle ülesanded"}, "d": {"ru": "Министерство внутренних дел (МВД) является органом исполнительной власти, осуществляющим функции по выработке и реализации государственной политики в сфере внутренних дел. Основными задачами являются охрана общественного порядка, обеспечение общественной безопасности, противодействие преступности и защита прав граждан.", "uk": "Міністерство внутрішніх справ (МВС) є органом виконавчої влади, що здійснює функції з вироблення та реалізації державної політики у сфері внутрішніх справ. Основними завданнями є охорона громадського порядку, забезпечення громадської безпеки, протидія злочинності та захист прав громадян.", "kk": "Ішкі істер министрлігі (ІІМ) — ішкі істер саласында мемлекеттік саясатты әзірлеу және іске асыру функцияларын жүзеге асыратын атқарушы билік органы. Негізгі міндеттері — қоғамдық тәртіпті қорғау, қоғамдық қауіпсіздікті қамтамасыз ету, қылмыстылыққа қарсы іс-қимыл және азаматтардың құқықтарын қорғау.", "et": "Siseministeerium (SM) on täitevvõimuorgan, mis täidab siseasjade valdkonna riigipoliitika väljatöötamise ja elluviimise ülesandeid. Põhiülesanded on avaliku korra kaitse, avaliku julgeoleku tagamine, kuritegevuse tõkestamine ja kodanike õiguste kaitse."}}, {"n": "Ст. 2", "t": {"ru": "Структура МВД", "uk": "Структура МВС", "kk": "ІІМ құрылымы", "et": "Siseministeeriumi struktuur"}, "d": {"ru": "В структуру МВД входят: Патрульно-постовая служба (ППС), Дорожно-патрульная служба (ДПС / ГИБДД), Уголовный Розыск (Детективы) и подразделения специального назначения (СОБР/ОМОН) для проведения силовых операций.", "uk": "До структури МВС входять: Патрульно-постова служба (ППС), Дорожньо-патрульна служба (ДПС / ДАІ), Кримінальний розшук (Детективи) та підрозділи спеціального призначення (СОБР/ОМОН) для проведення силових операцій.", "kk": "ІІМ құрылымына мыналар кіреді: Патрульдік-бекеттік қызмет (ППҚ), Жол-патрульдік қызмет (ЖПҚ / МАИ), Қылмыстық іздестіру (Детективтер) және күш операцияларын жүргізуге арналған арнайы мақсаттағы бөлімшелер (СОБР/ОМОН).", "et": "Siseministeeriumi struktuuri kuuluvad: patrull-postiteenistus (PPS), liikluspatrulliteenistus (DPS / GIBDD), kriminaaluurimine (detektiivid) ja erivägede üksused (SOBR/OMON) jõuoperatsioonideks."}}, {"n": "Ст. 3", "t": {"ru": "Основные обязанности сотрудников", "uk": "Основні обов’язки співробітників", "kk": "Қызметкерлердің негізгі міндеттері", "et": "Töötajate põhikohustused"}, "d": {"ru": "Сотрудник МВД обязан:\nЗнать и соблюдать Конституцию, Федеральные законы, Уголовный и Процессуальный кодексы.\nПринимать заявления граждан об уголовных и административных правонарушениях.\nОказывать первую помощь пострадавшим от правонарушений.\nПредставляться гражданам при обращении, предъявлять служебное удостоверение или жетон.\nСтрого соблюдать установленный законом порядок задержания подозреваемых лиц.", "uk": "Співробітник МВС зобов’язаний:\nЗнати та дотримуватися Конституції, федеральних законів, Кримінального та Процесуального кодексів.\nПриймати заяви громадян про кримінальні та адміністративні правопорушення.\nНадавати першу допомогу постраждалим від правопорушень.\nПредставлятися громадянам при зверненні, пред’являти службове посвідчення або жетон.\nСуворо дотримуватися встановленого законом порядку затримання підозрюваних осіб.", "kk": "ІІМ қызметкері міндетті:\nКонституцияны, федералдық заңдарды, Қылмыстық және Процестік кодекстерді білуге және сақтауға.\nАзаматтардың қылмыстық және әкімшілік құқық бұзушылықтар туралы арыздарын қабылдауға.\nҚұқық бұзушылықтан зардап шеккендерге алғашқы көмек көрсетуге.\nАзаматтарға жүгінген кезде өзін таныстыруға, қызметтік куәлікті немесе жетонды көрсетуге.\nКүдікті тұлғаларды ұстаудың заңмен белгіленген тәртібін қатаң сақтауға.", "et": "Siseministeeriumi töötaja on kohustatud:\nTundma ja järgima põhiseadust, föderaalseadusi, karistus- ja menetlusseadustikku.\nVõtma vastu kodanike avaldusi kriminaal- ja haldusrikkumiste kohta.\nOsutama esmaabi õigusrikkumiste ohvritele.\nTutvustama end kodanikele pöördumisel, esitama teenistustõendi või märgi.\nJärgima rangelt seaduses sätestatud kahtlustatavate kinnipidamise korda."}}, {"n": "Ст. 4", "t": {"ru": "Основные права сотрудников", "uk": "Основні права співробітників", "kk": "Қызметкерлердің негізгі құқықтары", "et": "Töötajate põhiõigused"}, "d": {"ru": "Для выполнения служебных обязанностей сотрудник МВД имеет право:\nТребовать от граждан прекращения противоправных действий.\nПроверять документы, удостоверяющие личность граждан, при наличии оснований подозревать их в совершении преступления или нахождении в розыске.\nВызывать граждан в полицию для выяснения обстоятельств по расследуемым уголовным делам.\nПроизводить личный досмотр граждан, их вещей и транспортных средств при наличии подозрений на хранение незаконных предметов (оружия без лицензии, наркотиков).\nБеспрепятственно проникать в жилые помещения в случаях преследования преступников, предотвращения угрозы жизни граждан или ликвидации чрезвычайных ситуаций.", "uk": "Для виконання службових обов’язків співробітник МВС має право:\nВимагати від громадян припинення протиправних дій.\nПеревіряти документи, що посвідчують особу громадян, за наявності підстав підозрювати їх у вчиненні злочину або перебуванні в розшуку.\nВикликати громадян до поліції для з’ясування обставин у кримінальних справах, що розслідуються.\nПроводити особистий огляд громадян, їхніх речей і транспортних засобів за наявності підозр у зберіганні незаконних предметів (зброї без ліцензії, наркотиків).\nБезперешкодно проникати до житлових приміщень у разі переслідування злочинців, запобігання загрозі життю громадян або ліквідації надзвичайних ситуацій.", "kk": "Қызметтік міндеттерін орындау үшін ІІМ қызметкері құқылы:\nАзаматтардан құқыққа қарсы әрекеттерді тоқтатуды талап етуге.\nАзаматтарды қылмыс жасады немесе іздестірілуде деп күдіктенуге негіз болған жағдайда олардың жеке басын куәландыратын құжаттарды тексеруге.\nТергелетін қылмыстық істер бойынша мән-жайларды анықтау үшін азаматтарды полицияға шақыруға.\nЗаңсыз заттарды (лицензиясыз қару, есірткі) сақтауға күдік болған жағдайда азаматтарды, олардың заттары мен көлік құралдарын жеке тінтуге.\nҚылмыскерлерді қуғын кезінде, азаматтардың өміріне төнген қауіптің алдын алу немесе төтенше жағдайларды жою үшін тұрғын үй-жайларға кедергісіз кіруге.", "et": "Teenistusülesannete täitmiseks on siseministeeriumi töötajal õigus:\nNõuda kodanikelt õigusvastaste tegude lõpetamist.\nKontrollida kodanike isikut tõendavaid dokumente, kui on alust kahtlustada neid kuriteos või tagaotsimises.\nKutsuda kodanikke politseisse uurimisel olevate kriminaalasjade asjaolude selgitamiseks.\nTeha kodanike, nende asjade ja sõidukite isikuläbivaatus, kui on kahtlus ebaseaduslike esemete (litsentsita relv, narkootikumid) hoidmises.\nTakistamatult siseneda eluruumidesse kurjategijate tagaajamisel, kodanike elu ohu ärahoidmiseks või hädaolukordade likvideerimiseks."}}, {"n": "Ст. 5", "t": {"ru": "Применение физической силы и специальных средств", "uk": "Застосування фізичної сили та спеціальних засобів", "kk": "Дене күшін және арнайы құралдарды қолдану", "et": "Füüsilise jõu ja erivahendite kasutamine"}, "d": {"ru": "Сотрудник полиции имеет право применять физическую силу и специальные средства (дубинку, наручники, слезоточивый газ, электрошокер / тайзер) для пресечения преступлений, преодоления противодействия законным требованиям, задержания лиц при попытке побега или активном сопротивлении.", "uk": "Співробітник поліції має право застосовувати фізичну силу та спеціальні засоби (кийок, кайданки, сльозогінний газ, електрошокер / тайзер) для припинення злочинів, подолання протидії законним вимогам, затримання осіб при спробі втечі або активному опорі.", "kk": "Полиция қызметкері қылмыстарды тоқтату, заңды талаптарға қарсылықты жеңу, қашуға әрекет жасағанда немесе белсенді қарсылық көрсеткенде тұлғаларды ұстау үшін дене күшін және арнайы құралдарды (таяқ, кісен, көзден жас ағызатын газ, электрошокер / тайзер) қолдануға құқылы.", "et": "Politseiniku õigus on kasutada füüsilist jõudu ja erivahendeid (nui, käerauad, pisargaas, elektrišokk / taiser) kuritegude tõkestamiseks, seaduslike nõuete vastupanu ületamiseks ning põgenemiskatsel või aktiivsel vastuseisul isikute kinnipidamiseks."}}, {"n": "Ст. 6", "t": {"ru": "Применение огнестрельного оружия", "uk": "Застосування вогнепальної зброї", "kk": "Атыс қаруын қолдану", "et": "Tulirelva kasutamine"}, "d": {"ru": "Огнестрельное оружие применяется как крайняя мера в следующих случаях:\nЗащита себя или других граждан от угрозы смерти или причинения тяжкого вреда здоровью.\nОсвобождение заложников или предотвращение террористических актов.\nЗадержание лица, совершившего тяжкое преступление и пытающегося скрыться, если иными средствами задержать его невозможно.\nОстановка транспортного средства путем его повреждения, если водитель создает реальную угрозу жизни людей и игнорирует требования об остановке.\nОбезвреживание опасных животных, угрожающих жизни людей.", "uk": "Вогнепальна зброя застосовується як крайній захід у таких випадках:\nЗахист себе або інших громадян від загрози смерті чи заподіяння тяжкої шкоди здоров’ю.\nЗвільнення заручників або запобігання терористичним актам.\nЗатримання особи, яка вчинила тяжкий злочин і намагається втекти, якщо іншими засобами затримати її неможливо.\nЗупинка транспортного засобу шляхом його пошкодження, якщо водій створює реальну загрозу життю людей та ігнорує вимоги про зупинку.\nЗнешкодження небезпечних тварин, що загрожують життю людей.", "kk": "Атыс қаруы мына жағдайларда аса шектен тыс шара ретінде қолданылады:\nӨзін немесе басқа азаматтарды өлім қаупінен немесе денсаулыққа ауыр зиян келтіру қаупінен қорғау.\nКепілдегілерді босату немесе лаңкестік актілердің алдын алу.\nАуыр қылмыс жасаған және қашуға тырысқан тұлғаны өзге құралдармен ұстау мүмкін болмаса, ұстау.\nЕгер жүргізуші адамдардың өміріне нақты қауіп төндіріп, тоқтату талаптарын елемесе, көлік құралын зақымдау арқылы тоқтату.\nАдамдардың өміріне қауіп төндіретін қауіпті жануарларды залалсыздандыру.", "et": "Tulirelva kasutatakse äärmise abinõuna järgmistel juhtudel:\nEnda või teiste kodanike kaitse surmaohu või raske tervisekahjustuse tekitamise ohu eest.\nPantvangide vabastamine või terroriaktide ärahoidmine.\nRaske kuriteo toime pannud ja põgeneda püüdva isiku kinnipidamine, kui muude vahenditega ei ole seda võimalik teha.\nSõiduki peatamine selle kahjustamise teel, kui juht seab reaalselt ohtu inimeste elu ja ignoreerib peatumisnõudeid.\nInimeste elu ohustavate ohtlike loomade kahjutuks tegemine."}}, {"n": "Ст. 7", "t": {"ru": "Порядок применения оружия", "uk": "Порядок застосування зброї", "kk": "Қаруды қолдану тәртібі", "et": "Relva kasutamise kord"}, "d": {"ru": "Перед непосредственным применением физической силы, спецсредств или оружия сотрудник обязан сделать устное предупреждение («Стоять, стрелять буду!»), предоставив нарушителю достаточно времени для выполнения требований, за исключением случаев, когда промедление создаёт прямую угрозу жизни самого сотрудника или граждан.", "uk": "Перед безпосереднім застосуванням фізичної сили, спецзасобів або зброї співробітник зобов’язаний зробити усне попередження («Стояти, буду стріляти!»), надавши порушнику достатньо часу для виконання вимог, за винятком випадків, коли зволікання створює пряму загрозу життю самого співробітника або громадян.", "kk": "Дене күшін, арнайы құралдарды немесе қаруды тікелей қолданар алдында қызметкер ауызша ескерту («Тоқта, атамын!») жасауға, бұзушыға талаптарды орындауға жеткілікті уақыт беруге міндетті, кідіріс қызметкердің өзінің немесе азаматтардың өміріне тікелей қауіп төндіретін жағдайларды қоспағанда.", "et": "Enne füüsilise jõu, erivahendite või relva vahetut kasutamist peab töötaja andma suulise hoiatuse («Seis, ma tulistan!»), andes rikkujale piisavalt aega nõuete täitmiseks, välja arvatud juhul, kui viivitus seab otsese ohu töötaja enda või kodanike elule."}}]});
DATA.splice(DATA.findIndex(s=>s.id==="law"),0,{"id": "arms", "t": {"ru": "🔫 Об оружии", "uk": "🔫 Про зброю", "kk": "🔫 Қару туралы", "et": "🔫 Relvaseadus"}, "items": [{"n": "ℹ️", "t": {"ru": "Вводное положение", "uk": "Вступне положення", "kk": "Кіріспе ереже", "et": "Sissejuhatav säte"}, "d": {"ru": "Регулирует оборот оружия на территории государства, правила получения лицензий, ношения, хранения и применения оружия.", "uk": "Регулює обіг зброї на території держави, правила отримання ліцензій, носіння, зберігання та застосування зброї.", "kk": "Мемлекет аумағында қару айналымын, лицензия алу, қару алып жүру, сақтау және қолдану ережелерін реттейді.", "et": "Reguleerib relvade käitlemist riigi territooriumil, litsentside saamise, kandmise, hoidmise ja kasutamise reegleid."}}, {"n": "Ст. 1", "t": {"ru": "Виды оружия", "uk": "Види зброї", "kk": "Қару түрлері", "et": "Relvaliigid"}, "d": {"ru": "Оружие по его предназначению разделяется на три основные категории:\nГражданское — оружие самообороны (травматические пистолеты, газовые баллончики), охотничье (гладкоствольное, нарезное), спортивное.\nСлужебное — оружие, выдаваемое сотрудникам ЧОП, инкассаторам.\nБоевое ручное стрелковое и холодное оружие — оружие, состоящее на вооружении государственных силовых структур (МВД, Армия, ФСБ).", "uk": "Зброя за своїм призначенням поділяється на три основні категорії:\nЦивільна — зброя самооборони (травматичні пістолети, газові балончики), мисливська (гладкоствольна, нарізна), спортивна.\nСлужбова — зброя, що видається співробітникам ЧОП (приватних охоронних підприємств), інкасаторам.\nБойова ручна стрілецька та холодна зброя — зброя, що перебуває на озброєнні державних силових структур (МВС, Армія, ФСБ).", "kk": "Қару мақсатына қарай үш негізгі санатқа бөлінеді:\nАзаматтық — өзін-өзі қорғау қаруы (жарақаттық тапаншалар, газ баллондары), аңшылық (тегіс ұңғылы, ойықты), спорттық.\nҚызметтік — жеке күзет кәсіпорындарының (ЧОП) қызметкерлеріне, инкассаторларға берілетін қару.\nЖауынгерлік қол атыс және суық қару — мемлекеттік күш құрылымдарының (ІІМ, Армия, ФҚҚ) қарамағындағы қару.", "et": "Relvad jagunevad otstarbe järgi kolme põhikategooriasse:\nKodanikurelv — enesekaitserelv (traumapüstolid, gaasiballoonid), jahirelv (sileraudne, vintraudne), spordirelv.\nTeenistusrelv — erakaitseettevõtete (ChOP) töötajatele ja inkassaatoritele antav relv.\nSõjalised käsitulirelvad ja külmrelvad — riiklike jõustruktuuride (SM, armee, FSB) relvastuses olev relv."}}, {"n": "Ст. 2", "t": {"ru": "Основные определения", "uk": "Основні визначення", "kk": "Негізгі анықтамалар", "et": "Põhimõisted"}, "d": {"ru": "Юридическая трактовка терминов. Огнестрельным признается оружие, предназначенное для механического поражения цели на расстоянии снарядом, получающим направленное движение за счет энергии порохового заряда. Холодным признается оружие, предназначенное для поражения цели при помощи мускульной силы человека при непосредственном контакте с объектом поражения (ножи, кастеты, биты).", "uk": "Юридичне трактування термінів. Вогнепальною визнається зброя, призначена для механічного ураження цілі на відстані снарядом, що отримує спрямований рух за рахунок енергії порохового заряду. Холодною визнається зброя, призначена для ураження цілі за допомогою м’язової сили людини при безпосередньому контакті з об’єктом ураження (ножі, кастети, бити).", "kk": "Терминдердің заңдық түсіндірмесі. Оқ-дәрі зарядының энергиясы есебінен бағытталған қозғалыс алатын снарядпен мақсатты қашықтықтан механикалық жоюға арналған қару атыс қаруы деп танылады. Адамның бұлшықет күшімен, жою объектісімен тікелей жанасу арқылы мақсатты жоюға арналған қару суық қару деп танылады (пышақтар, кастеттер, таяқтар).", "et": "Mõistete juriidiline tõlgendus. Tulirelvaks loetakse relva, mis on mõeldud sihtmärgi mehaaniliseks tabamiseks kaugelt püssirohulaengu energia abil suunatud liikumise saavutava lasuga. Külmrelvaks loetakse relva, mis on mõeldud sihtmärgi tabamiseks inimese lihasjõuga vahetul kokkupuutel sihtmärgiga (noad, rusikarauad, nuiad)."}}, {"n": "Ст. 3", "t": {"ru": "Порядок получения лицензии на оружие", "uk": "Порядок отримання ліцензії на зброю", "kk": "Қаруға лицензия алу тәртібі", "et": "Relvalitsentsi saamise kord"}, "d": {"ru": "Право на приобретение гражданского оружия имеют дееспособные граждане, достигшие возраста 18 лет, после прохождения медицинского освидетельствования (в МЗ) на отсутствие психических заболеваний и наркозависимости, сдачи экзамена по правилам обращения с оружием и оплаты государственной пошлины. Лицензия может быть аннулирована в случае совершения уголовного преступления или систематического нарушения общественного порядка.", "uk": "Право на придбання цивільної зброї мають дієздатні громадяни, які досягли віку 18 років, після проходження медичного огляду (в МОЗ) на відсутність психічних захворювань і наркозалежності, складання іспиту з правил поводження зі зброєю та сплати державного мита. Ліцензія може бути анульована у разі вчинення кримінального злочину або систематичного порушення громадського порядку.", "kk": "Азаматтық қаруды сатып алу құқығы 18 жасқа толған, әрекетке қабілетті азаматтарда болады, ол үшін психикалық аурулар мен есірткіге тәуелділіктің жоқтығына медициналық куәландырудан (ДСМ-де) өту, қару қолдану ережелері бойынша емтихан тапсыру және мемлекеттік алым төлеу қажет. Қылмыстық қылмыс жасалған немесе қоғамдық тәртіп жүйелі түрде бұзылған жағдайда лицензия күшін жоюы мүмкін.", "et": "Õigus kodanikurelva soetada on teovõimelistel 18-aastastel kodanikel pärast meditsiinilist läbivaatust (TM-is) psüühikahäirete ja narkosõltuvuse puudumise kohta, relvakäsitsemise reeglite eksami sooritamist ja riigilõivu tasumist. Litsents võidakse tühistada kuriteo toimepanemise või avaliku korra süstemaatilise rikkumise korral."}}, {"n": "Ст. 4", "t": {"ru": "Правила ношения и транспортировки оружия", "uk": "Правила носіння та транспортування зброї", "kk": "Қаруды алып жүру және тасымалдау ережелері", "et": "Relva kandmise ja vedamise reeglid"}, "d": {"ru": "Гражданское оружие должно переноситься в разряженном состоянии, в специальной кобуре или чехле. При себе гражданин обязан всегда иметь действующую лицензию на оружие и паспорт.", "uk": "Цивільна зброя має переноситися в розрядженому стані, у спеціальній кобурі або чохлі. Громадянин зобов’язаний завжди мати при собі чинну ліцензію на зброю та паспорт.", "kk": "Азаматтық қару оқталмаған күйде, арнайы қапшықта немесе қапта тасымалдануы тиіс. Азамат өзімен бірге әрдайым қолданыстағы қару лицензиясын және төлқұжатын алып жүруге міндетті.", "et": "Kodanikurelva tuleb kanda laadimata olekus, spetsiaalses kabuuris või ümbrises. Kodanik on kohustatud alati kaasas kandma kehtivat relvalitsentsi ja passi."}}, {"n": "Ст. 5", "t": {"ru": "Запрет на ношение оружия в открытом виде", "uk": "Заборона носіння зброї у відкритому вигляді", "kk": "Қаруды ашық алып жүруге тыйым", "et": "Relva avalikult kandmise keeld"}, "d": {"ru": "Категорически запрещено ношение любого холодного или огнестрельного оружия в открытом виде в публичных местах, на улицах, в правительственных зданиях (нарушение классифицируется по ст. 24 УК РФ), за исключением сотрудников государственных силовых ведомств при исполнении служебных обязанностей.", "uk": "Категорично забороняється носіння будь-якої холодної або вогнепальної зброї у відкритому вигляді в публічних місцях, на вулицях, в урядових будівлях (порушення кваліфікується за ст. 24 КК РФ), за винятком співробітників державних силових відомств при виконанні службових обов’язків.", "kk": "Қоғамдық орындарда, көшелерде, үкіметтік ғимараттарда кез келген суық немесе атыс қаруын ашық алып жүруге қатаң тыйым салынады (бұзушылық РФ ҚК 24-бабы бойынша сараланады), мемлекеттік күш құрылымдарының қызметкерлерін қызметтік міндеттерін орындау кезінде қоспағанда.", "et": "Igasuguse külm- või tulirelva avalik kandmine avalikes kohtades, tänavatel ja valitsushoonetes on rangelt keelatud (rikkumine kvalifitseeritakse VF KrK artikli 24 alusel), välja arvatud riiklike jõuametite töötajad teenistusülesannete täitmisel."}}, {"n": "Ст. 6", "t": {"ru": "Ответственность за незаконный оборот", "uk": "Відповідальність за незаконний обіг", "kk": "Заңсыз айналым үшін жауапкершілік", "et": "Vastutus ebaseadusliku käitlemise eest"}, "d": {"ru": "Изготовление, модернизация, продажа оружия \"с рук\", а также хранение и ношение оружия без официально выданной лицензии уголовно наказуемы и ведут к изъятию оружия, аннулированию лицензии и лишению свободы.", "uk": "Виготовлення, модернізація, продаж зброї «з рук», а також зберігання та носіння зброї без офіційно виданої ліцензії є кримінально караними та призводять до вилучення зброї, анулювання ліцензії та позбавлення волі.", "kk": "Қаруды жасау, жаңғырту, «қолдан» сату, сондай-ақ ресми берілген лицензиясыз қаруды сақтау және алып жүру қылмыстық жазаланады және қарудың тәркіленуіне, лицензияның жойылуына және бас бостандығынан айыруға әкеледі.", "et": "Relva valmistamine, moderniseerimine, «käest kätte» müümine ning relva hoidmine ja kandmine ilma ametlikult välja antud litsentsita on kriminaalkorras karistatav ning toob kaasa relva konfiskeerimise, litsentsi tühistamise ja vangistuse."}}, {"n": "Ст. 7", "t": {"ru": "Применение оружия гражданами", "uk": "Застосування зброї громадянами", "kk": "Азаматтардың қаруды қолдануы", "et": "Relva kasutamine kodanike poolt"}, "d": {"ru": "Граждане могут применять оружие на законных основаниях исключительно для защиты жизни, здоровья и собственности в состоянии необходимой обороны или крайней необходимости. Применению оружия должно предшествовать четко выраженное предупреждение о намерении его использовать.", "uk": "Громадяни можуть застосовувати зброю на законних підставах виключно для захисту життя, здоров’я та власності у стані необхідної оборони або крайньої необхідності. Застосуванню зброї має передувати чітко виражене попередження про намір її використати.", "kk": "Азаматтар қаруды заңды негізде тек қажетті қорғаныс немесе аса қажеттілік жағдайында өмірді, денсаулықты және меншікті қорғау үшін ғана қолдана алады. Қаруды қолданудан бұрын оны пайдалану ниеті туралы анық ескерту жасалуы тиіс.", "et": "Kodanikud võivad relva seaduslikel alustel kasutada üksnes elu, tervise ja vara kaitseks hädakaitse või äärmise hädaseisundi korral. Relva kasutamisele peab eelnema selge hoiatus kavatsuse kohta seda kasutada."}}]});
